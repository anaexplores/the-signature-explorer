<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- favicon.svg — zero external resources (K4): one local file, referenced by
       relative href from all three pages, exactly like css/app.css already is.
       Motif: a keyhole — "prove you hold the key without showing it" is the
       product's own tagline (SPEC S0). Two flat shapes, no gradients/blur/text, so
       it still reads at 16px. Colors are the product's own dark-theme accent
       (#7ee0c3, css/theme.css --accent) and on-accent ink (#12241d, --on-accent-ink)
       baked in as literals on purpose: a favicon renders in the BROWSER'S tab
       chrome, outside the page's own light/dark cascade, so it needs its own fixed
       palette rather than var(--...) references that would never resolve here. A
       solid-filled background square (not transparent) keeps it legible on both a
       light and a dark browser tab bar. -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="#7ee0c3"/>
  <circle cx="16" cy="13" r="5" fill="#12241d"/>
  <path d="M13 16 L19 16 L16.5 24 L15.5 24 Z" fill="#12241d"/>
</svg>
