<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Favicon: a keyhole, "prove you hold the key without showing it". Flat shapes
       only, so it still reads at 16px. Colors are the site's dark-theme accent
       (#7ee0c3) and the ink used on top of it (#12241d), baked in as literals: a
       favicon is drawn in the browser's tab bar, outside the page's light/dark CSS.
       Transparent corners, so the rounded tile sits cleanly on light and dark tabs. -->
  <rect width="1024" height="1024" rx="287" fill="#7ee0c3"/>
  <g fill="#12241d">
    <circle cx="512" cy="429" r="155"/>
    <path d="M 431 485 L 593 485 L 667 750 L 357 750 Z"/>
  </g>
</svg>
